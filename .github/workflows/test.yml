name: test

on:
  push:
  pull_request:

jobs:
  test:
    # package.json restricts installs to darwin (this is a macOS-only CLI/daemon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test
